<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Market Square Tycoon</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="loading">🥕 よみこみ中…</div>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="topleft">
      <div class="counter money"><img class="coin" src="ui/coin.png" alt="" /><b id="money">0</b></div>
      <div class="counter stats"><span>売上 <b id="revenue">0</b></span><span>客 <b id="customers">0</b></span></div>
    </div>
    <div id="mission"><span class="label">目標</span><b id="goaltext"></b></div>
    <div id="topright">
      <button id="mute" class="round" title="効果音 ON/OFF">🔊</button>
      <button id="reset" class="round" title="セーブを消して最初から">↺</button>
    </div>
    <div id="toast"></div>
    <div id="panel" hidden></div>
    <div id="build"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
